<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>André Pedrosa · CV</title>
  <meta name="description" content="CV of André Pedrosa.">
  <meta property="og:title" content="André Pedrosa · CV">
  <meta property="og:description" content="CV of André Pedrosa.">
  <meta property="og:type" content="profile">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef0f3;
      --fg: #1d2330;
      --muted: #5b6475;
      --bar: #ffffff;
      --border: #d9dde4;
      --accent: #1f5fbf;
      --accent-fg: #ffffff;
      --shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 6px 20px rgba(0, 0, 0, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --fg: #e7e9ee;
        --muted: #9aa3b2;
        --bar: #1f2229;
        --border: #2e323b;
        --accent: #6ea0ff;
        --accent-fg: #0d1117;
        --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 6px 20px rgba(0, 0, 0, .4);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
    }
    .bar {
      max-width: 880px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .name { font-weight: 600; font-size: 1.05rem; }
    .download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
      font-size: .95rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .download:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    #pages { display: flex; flex-direction: column; gap: 20px; }
    .page {
      position: relative;
      width: 100%;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .page canvas { display: block; width: 100%; height: 100%; }
    .page a.link { position: absolute; }
    .page a.link:hover { background: rgba(31, 95, 191, .12); }
    #status { color: var(--muted); text-align: center; padding: 48px 0; }
    #status a { color: var(--accent); }
    @media (max-width: 480px) {
      main { padding: 12px 8px 32px; }
      #pages { gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <span class="name">André Pedrosa</span>
      <a class="download" href="cv.pdf" download="Andre_Pedrosa_CV.pdf">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Download PDF
      </a>
    </div>
  </header>

  <main>
    <p id="status">Loading CV…</p>
    <noscript><p style="text-align:center"><a href="cv.pdf">Open the CV (PDF)</a></p></noscript>
    <div id="pages" aria-label="CV pages"></div>
  </main>

  <script type="module">
    const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/";
    const PDF_URL = "cv.pdf";

    const pagesEl = document.getElementById("pages");
    const statusEl = document.getElementById("status");

    let pdf = null;
    let renderedWidth = 0;
    let renderToken = 0;

    function showError() {
      statusEl.hidden = false;
      statusEl.innerHTML = 'Couldn’t display the CV here. <a href="cv.pdf">Open the PDF</a> instead.';
    }

    // Overlay the PDF's link annotations as real <a> elements, positioned in
    // percentages so they stay aligned however the canvas is scaled.
    async function addLinks(page, viewport, sheet) {
      for (const a of await page.getAnnotations()) {
        if (a.subtype !== "Link" || !a.url) continue;
        const [x1, y1, x2, y2] = viewport.convertToViewportRectangle(a.rect);
        const link = document.createElement("a");
        link.className = "link";
        link.href = a.url;
        if (/^https?:/i.test(a.url)) {
          link.target = "_blank";
          link.rel = "noopener";
        }
        link.setAttribute("aria-label", a.url.replace(/^mailto:/i, ""));
        Object.assign(link.style, {
          left: `${(Math.min(x1, x2) / viewport.width) * 100}%`,
          top: `${(Math.min(y1, y2) / viewport.height) * 100}%`,
          width: `${(Math.abs(x2 - x1) / viewport.width) * 100}%`,
          height: `${(Math.abs(y2 - y1) / viewport.height) * 100}%`,
        });
        sheet.append(link);
      }
    }

    // Render every page at the container's width (times the device pixel
    // ratio so text stays sharp on phones). The old pages stay on screen
    // until the new ones are ready, so resizing doesn't flicker.
    async function renderAll() {
      const width = pagesEl.clientWidth;
      if (!pdf || !width || width === renderedWidth) return;
      renderedWidth = width;
      const token = ++renderToken;
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const sheets = [];

      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const viewport = page.getViewport({ scale: width / page.getViewport({ scale: 1 }).width });

        const sheet = document.createElement("div");
        sheet.className = "page";
        sheet.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);
        canvas.setAttribute("role", "img");
        canvas.setAttribute("aria-label", `CV page ${n} of ${pdf.numPages}`);
        sheet.append(canvas);

        await page.render({
          canvasContext: canvas.getContext("2d"),
          viewport,
          transform: dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0],
        }).promise;
        await addLinks(page, viewport, sheet);

        if (token !== renderToken) return; // a newer resize took over
        sheets.push(sheet);
      }

      pagesEl.replaceChildren(...sheets);
      statusEl.hidden = true;
    }

    try {
      const pdfjsLib = await import(PDFJS + "build/pdf.min.mjs");
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "build/pdf.worker.min.mjs";
      pdf = await pdfjsLib.getDocument({
        url: PDF_URL,
        cMapUrl: PDFJS + "cmaps/",
        cMapPacked: true,
        standardFontDataUrl: PDFJS + "standard_fonts/",
      }).promise;
      await renderAll();

      let timer;
      new ResizeObserver(() => {
        clearTimeout(timer);
        timer = setTimeout(() => renderAll().catch(showError), 200);
      }).observe(pagesEl);
    } catch (err) {
      console.error(err);
      showError();
    }
  </script>
</body>
</html>
